    <linearGradient id="abdomen" x1="21" y1="43" x2="44" y2="67" gradientUnits="userSpaceOnUse"><stop stop-color="#356345"/><stop offset=".48" stop-color="#b5d559"/><stop offset=".78" stop-color="#edffa2"/><stop offset="1" stop-color="#719441"/></linearGradient>
